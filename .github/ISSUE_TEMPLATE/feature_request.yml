name: "✨ 功能请求"
description: "建议新功能或改进"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你的想法！本项目定位是「**管理游戏助手本体**」的聚合启动器
        （安装 / 版本 / changelog / 更新 / 启动 / 卸载）。
        如果你想要的是「多账号排队挂机调度」，那属于 AUTO-MAS 那类工具的范畴，
        两边是上下游互补关系——详见 README 的「与 AUTO-MAS 的区别」一节。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在没有这个功能时，你遇到了什么麻烦？
      placeholder: "每次更新都要手动确认三遍，怕点错……"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的做法
      description: 你希望它长什么样 / 怎么交互，越具体越好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有别的做法也能解决？为什么更希望上面那种？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 安装
        - 更新
        - 启动 / 运行状态
        - 总览页（轮播 / 排行榜 / 预约区）
        - 侧栏 / 界面
        - 设置页
        - 新增支持的助手
        - 其它
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 截图、草图、参考别的软件的做法，都可以贴
    validations:
      required: false
